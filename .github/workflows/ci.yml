name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if a production dependency has a known vulnerability. Dev-only tools are reviewed by hand.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      # The client types are generated from the versioned contracts in openapi/. Regenerating must not
      # change anything: if it does, someone edited a contract (or the types) without the other.
      - name: Verify API types match the contracts
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain src/lib/api/generated)" ]; then
            git diff --stat src/lib/api/generated
            echo "::error::src/lib/api/generated is stale. Run npm run api:generate and commit."
            exit 1
          fi

      # Like EF Core's HasPendingModelChanges: a schema change without its migration fails the build.
      - name: Verify migrations match the schema
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::src/lib/db/schema.ts changed without a migration. Run npm run db:generate."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Ubuntu runners ship with Docker, so Testcontainers-based integration tests run here.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  end-to-end:
    name: End-to-end with SchedulingApi and WebhookRelay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7

      # Projects 1 and 2 are public: build both from their main branch, next to this repository.
      - uses: actions/checkout@v7
        with:
          repository: EduardoCruz78/SchedulingApi
          path: scheduling-api

      - uses: actions/checkout@v7
        with:
          repository: EduardoCruz78/WebhookRelay
          path: webhook-relay

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the three services and Playwright
        env:
          CI: 'true'
          SCHEDULING_API_DIR: ${{ github.workspace }}/scheduling-api
          WEBHOOK_RELAY_DIR: ${{ github.workspace }}/webhook-relay
        run: bash e2e/run.sh

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            e2e/e2e-logs.txt
          retention-days: 7
